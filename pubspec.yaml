name: mou3adli
description: "Calcul de moyenne tunisienne avec jeux éducatifs"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ═══ STATE MANAGEMENT ═══
  provider: ^6.1.2

  # ═══ UI & ANIMATIONS ═══
  percent_indicator: ^4.2.4
  fl_chart: ^0.71.0
  confetti: ^0.8.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2

  # ═══ NAVIGATION & ROUTING ═══
  go_router: ^14.8.1

  # ═══ STORAGE & PERSISTENCE ═══
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5

  # ═══ CALENDAR ═══
  table_calendar: ^3.2.0

  # ═══ NOTIFICATIONS ✅ AJOUTÉ ═══
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # ═══ UTILITIES ═══
  intl: ^0.20.2
  uuid: ^4.5.1

  # ═══ IMAGE PICKER ═══
  image_picker: ^1.1.2

  # ═══ ICONS ═══
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # ═══ ASSETS ═══
  assets:
    - assets/images/
    - assets/sounds/          # ✅ AJOUTÉ : Sons de notification